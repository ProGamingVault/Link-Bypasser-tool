<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Link Bypasser - Fast & Secure</title>
    <!-- Tailwind CSS for modern dark-mode UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="w-full py-6 px-8 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-cyan-400">PRO GAMING <span class="text-white">VAULT</span></h1>
        <span class="text-xs bg-cyan-900/50 text-cyan-300 px-3 py-1 rounded-full border border-cyan-700/50">Global v2.7</span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-2xl w-full text-center space-y-6">
            <h2 class="text-4xl font-extrabold tracking-tight">Universal Link Bypasser</h2>
            <p class="text-gray-400 text-sm">Bypass Linkvertise, LootLabs, Work.ink, Boosty, and shortener links worldwide instantly.</p>

            <!-- Error / Warning Box -->
            <div id="alertBox" class="hidden p-4 rounded-lg bg-red-950/50 border border-red-800 text-red-300 text-sm"></div>

            <!-- Input Box Card -->
            <div class="bg-gray-900/80 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
                <div class="relative">
                    <input type="url" id="targetUrl" placeholder="Paste any shortener or locked URL here..." 
                        class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-4 text-sm focus:outline-none focus:border-cyan-500 transition placeholder-gray-500 text-white">
                </div>
                <button onclick="handleBypass()" id="bypassBtn"
                    class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                    Bypass URL 🚀
                </button>
            </div>

            <!-- Result Box (Hidden by default) -->
            <div id="resultContainer" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-3 text-left">
                <label class="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Successfully Bypassed Link:</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="finalResultUrl" readonly class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-cyan-300 focus:outline-none">
                    <button onclick="copyResult()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">Copy</button>
                    <a id="openLinkBtn" href="#" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition text-center">Open</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 border-t border-gray-800 text-center text-xs text-gray-500">
        &copy; 2026 Pro Gaming Vault Utility. Global Bypass Service.
    </footer>

    <!-- JavaScript Logic with URL Verification -->
    <script>
        function showAlert(message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 6000);
        }

        function isValidHttpUrl(string) {
            let url;
            try {
                url = new URL(string);
            } catch (_) {
                return false;
            }
            return url.protocol === "http:" || url.protocol === "https:";
        }

        async function handleBypass() {
            const urlInput = document.getElementById('targetUrl').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const bypassBtn = document.getElementById('bypassBtn');
            
            if (!urlInput) {
                showAlert("Please enter a valid URL first!");
                return;
            }

            bypassBtn.innerText = "Bypassing... Please wait ⏳";
            bypassBtn.disabled = true;
            resultContainer.classList.add('hidden');

            let bypassedLink = null;

            const apis = [
                `https://api.bypass.vip/bypass?url=${encodeURIComponent(urlInput)}`,
                `https://bypass.botpro.workers.dev/?url=${encodeURIComponent(urlInput)}`
            ];

            for (let apiUrl of apis) {
                try {
                    const response = await fetch(apiUrl, { mode: 'cors' });
                    const data = await response.json();
                    
                    let possibleLink = data.destination || data.url || data.result;
                    
                    // Check if the returned result is actually a valid URL (not an error text)
                    if (possibleLink && isValidHttpUrl(possibleLink)) {
                        bypassedLink = possibleLink;
                        break;
                    }
                } catch (e) {
                    continue; 
                }
            }

            bypassBtn.innerText = "Bypass URL 🚀";
            bypassBtn.disabled = false;

            if (bypassedLink) {
                document.getElementById('finalResultUrl').value = bypassedLink;
                document.getElementById('openLinkBtn').href = bypassedLink;
                resultContainer.classList.remove('hidden');
            } else {
                showAlert("⚠️ Public bypass API is currently offline or limited. Please update the API endpoint or try another link.");
            }
        }

        function copyResult() {
            const copyText = document.getElementById('finalResultUrl');
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("Bypassed link copied to clipboard!");
        }
    </script>
</body>
</html>
